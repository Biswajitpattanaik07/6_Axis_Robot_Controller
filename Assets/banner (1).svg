<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Axion: 6-axis robot arm controller</title>
  <desc id="d">A green PCB-style banner. A robot arm is drawn as a copper trace with six joint pads, J1 to J6.</desc>

  <!-- solder mask -->
  <rect width="1280" height="320" fill="#0E3B2C"/>
  <rect x="10" y="10" width="1260" height="300" rx="10" fill="none" stroke="#EDEAE0" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- mounting holes -->
  <g fill="#0A2A20" stroke="#C99A5B" stroke-width="3">
    <circle cx="34" cy="34" r="9"/><circle cx="1246" cy="34" r="9"/>
    <circle cx="34" cy="286" r="9"/><circle cx="1246" cy="286" r="9"/>
  </g>

  <!-- background routing (faint) -->
  <g fill="none" stroke="#1F5E48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 300 H300 L330 270 H560 L590 300 H760"/>
    <path d="M420 20 H520 L550 50 H700 L730 20 H800"/>
    <path d="M1060 300 H1150 L1180 270 H1240"/>
    <path d="M640 60 V120 L670 150 V230"/>
    <path d="M1010 20 V50 L1040 80"/>
  </g>
  <g fill="#1F5E48">
    <circle cx="300" cy="300" r="5"/><circle cx="760" cy="300" r="5"/>
    <circle cx="800" cy="20" r="5"/><circle cx="670" cy="230" r="5"/>
    <circle cx="1240" cy="270" r="5"/><circle cx="1040" cy="80" r="5"/>
  </g>

  <!-- title block -->
  <text x="64" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="6" fill="#EDEAE0">AXION</text>
  <text x="68" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#EDEAE0">6-axis robot arm controller</text>
  <text x="68" y="244" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#E4B877">STM32F103 board with CAN, USB and NRF24L01. KiCad. Open hardware.</text>

  <!-- the arm, drawn as a copper trace -->
  <g fill="none" stroke="#C99A5B" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M800 288 H960"/>
    <path d="M880 288 V205 L950 135 H1050 L1105 80 H1180"/>
    <path d="M1180 80 L1220 52"/>
    <path d="M1180 80 L1222 108"/>
  </g>

  <!-- joint pads J1 to J6 -->
  <g fill="#E8C78F" stroke="#0A2A20" stroke-width="4">
    <circle cx="880" cy="288" r="17"/>
    <circle cx="880" cy="205" r="17"/>
    <circle cx="950" cy="135" r="17"/>
    <circle cx="1050" cy="135" r="17"/>
    <circle cx="1105" cy="80" r="17"/>
    <circle cx="1180" cy="80" r="17"/>
  </g>
  <g fill="#0A2A20">
    <circle cx="880" cy="288" r="6"/><circle cx="880" cy="205" r="6"/>
    <circle cx="950" cy="135" r="6"/><circle cx="1050" cy="135" r="6"/>
    <circle cx="1105" cy="80" r="6"/><circle cx="1180" cy="80" r="6"/>
  </g>

  <!-- silkscreen labels -->
  <g font-family="'Courier New',Consolas,monospace" font-size="16" font-weight="700" fill="#EDEAE0">
    <text x="906" y="294">J1</text>
    <text x="906" y="211">J2</text>
    <text x="976" y="123">J3</text>
    <text x="1030" y="176">J4</text>
    <text x="1084" y="52">J5</text>
    <text x="1160" y="130">J6</text>
  </g>

  <!-- gripper pads -->
  <g fill="#E8C78F" stroke="#0A2A20" stroke-width="3">
    <circle cx="1220" cy="52" r="9"/><circle cx="1222" cy="108" r="9"/>
  </g>
</svg>
